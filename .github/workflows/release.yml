name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore SportHubBase/packages.config -PackagesDirectory packages -NonInteractive

      - name: Установить версию приложения из тега
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = [version]($env:RELEASE_TAG -replace '^[vV]', '')
          $version = [version]::new($tagVersion.Major, $tagVersion.Minor, [Math]::Max(0, $tagVersion.Build), [Math]::Max(0, $tagVersion.Revision))
          if (@($version.Major, $version.Minor, $version.Build, $version.Revision).Where({ $_ -gt 65534 }).Count -gt 0) { throw 'Компоненты версии должны быть не больше 65534.' }
          $path = 'SportHubBase/Properties/AssemblyInfo.cs'
          $source = [IO.File]::ReadAllText($path)
          $source = $source -replace 'AssemblyVersion\("[^"]+"\)', ('AssemblyVersion("' + $version + '")')
          $source = $source -replace 'AssemblyFileVersion\("[^"]+"\)', ('AssemblyFileVersion("' + $version + '")')
          [IO.File]::WriteAllText($path, $source, [Text.UTF8Encoding]::new($true))

      - name: Build Solution
        run: msbuild SportHubBase.Tests/SportHubBase.Tests.csproj /p:Configuration=Release /verbosity:minimal /nologo

      - name: Проверить перед публикацией
        shell: pwsh
        run: |
          & SportHubBase.Tests/bin/Release/SportHubBase.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Release ZIP and Manifest
        id: pack
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $outDir = "SportHubBase\bin\Release"
          $zipName = "SportHubBase-$version.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath $zipName
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash

          $xml = @"
          <?xml version="1.0" encoding="utf-8"?>
          <item>
              <version>$version</version>
              <url>https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$zipName</url>
              <mandatory mode="2">false</mandatory>
              <checksum algorithm="SHA256">$hash</checksum>
          </item>
          "@
          Set-Content -Path "update.xml" -Value $xml -Encoding UTF8
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            update.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
